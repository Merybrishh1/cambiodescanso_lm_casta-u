<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Avisos">
<title>Avisos · aperturas y cierres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Cormorant+Garamond:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ec;--card:#fff;--text:#222;--muted:#6b6b66;--border:#e1ddd3}
body{--accent:#55534e}
body[data-r="marivuelta"]{--accent:#6f8566}
body[data-r="castanu"]{--accent:#2b2b2b}
@media (prefers-color-scheme:dark){
  :root{--bg:#161615;--card:#222221;--text:#f2f1ee;--muted:#a3a29c;--border:#33332f}
  body[data-r="marivuelta"]{--accent:#7f9575}
  body[data-r="castanu"]{--accent:#55534e}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 14px max(40px,env(safe-area-inset-bottom))}
.wrap{max-width:1000px;margin:auto;display:grid;gap:18px}
@media(min-width:880px){.wrap{grid-template-columns:1fr 1fr;align-items:start}.prev{position:sticky;top:14px}}
h1{font-size:1.2rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sel button{padding:16px 6px;border:2px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer}
.sel button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;font-size:.9rem;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
canvas{display:block;margin:auto;max-width:100%;max-height:64vh;width:auto;height:auto;border:1px solid var(--border);border-radius:4px;background:#fff}
#empty{padding:40px 10px;text-align:center;color:var(--muted)}
label{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=date],textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:1rem}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:9px 12px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:20px;font-size:.9rem;cursor:pointer}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;text-align:center;margin-top:10px}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--border);font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px}.row>*{flex:1}
input[type=file]{display:none}
input[type=range]{width:100%}
.hint{color:var(--muted);font-size:.8rem;margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="prev card">
    <h1>Avisos de apertura y cierre</h1>
    <div class="sel" id="sel">
      <button data-r="castanu">El Rincón del Castañu</button>
      <button data-r="marivuelta">La Marivuelta</button>
    </div>
    <div id="empty">Elige primero el restaurante.</div>
    <div id="work" style="display:none">
      <div class="tabs" id="tabs">
        <button data-f="retrato" class="on">Retrato</button>
        <button data-f="story">Story</button>
        <button data-f="a5">A5</button>
      </div>
      <canvas id="cv"></canvas>
    </div>
    <button class="btn" id="dlRetrato" disabled>Descargar Retrato (JPG)</button>
    <button class="btn" id="dlStory" disabled>Descargar Story (JPG)</button>
    <button class="btn" id="dlA5" disabled>Descargar A5 (PDF)</button>
    <button class="btn sec" id="share" disabled>Compartir el formato que estoy viendo</button>
  </div>

  <div class="card">
    <label style="margin-top:0">Tipo de aviso (rellena el texto, puedes editarlo)</label>
    <div class="chips" id="chips">
      <button data-p="cerrado">Cerrado</button>
      <button data-p="abrimos">Abrimos</button>
      <button data-p="cambio">Cambio de descanso</button>
      <button data-p="vacaciones">Vacaciones</button>
    </div>

    <div class="row">
      <div><label for="d1">Desde (fecha)</label><input type="date" id="d1"></div>
      <div><label for="d2">Hasta (opcional)</label><input type="date" id="d2"></div>
    </div>
    <label for="titulo">Título grande</label>
    <input type="text" id="titulo">
    <label for="cuando">Cuándo</label>
    <input type="text" id="cuando" placeholder="Lunes 3 de noviembre">
    <label for="mensaje">Mensaje (cada línea, un párrafo)</label>
    <textarea id="mensaje"></textarea>
    <label for="d3">Reabrimos el (fecha, opcional)</label>
    <input type="date" id="d3">
    <label for="vuelta">Texto de reapertura</label>
    <input type="text" id="vuelta" placeholder="Volvemos el martes 4 de noviembre">

    <label>Imagen de fondo (opcional)</label>
    <div class="row">
      <label class="btn sec" for="bg" style="margin:0">Elegir imagen</label>
      <button class="btn sec" id="bgQuit" style="margin:0">Quitar</button>
    </div>
    <input type="file" id="bg" accept="image/*">
    <label for="opac">Opacidad del panel blanco</label>
    <input type="range" id="opac" min="40" max="100" value="88">
    <p class="hint">Las fechas se escriben solas al elegirlas, y puedes corregir el texto a mano.</p>
  </div>
</div>

const FORMATS={
  retrato:{w:1080,h:1350,inset:{x:60,t:60,b:60}},
  story:{w:1080,h:1920,inset:{x:60,t:230,b:280}},
  a5:{w:1748,h:2480,inset:{x:70,t:70,b:70}}
};
const PRESETS={
  cerrado:{t:'Cerrado',m:'Hoy descansamos.\n¡Gracias por vuestra comprensión!'},
  abrimos:{t:'Abrimos',m:'Excepcionalmente abrimos este día.\n¡Os esperamos!'},
  cambio:{t:'Cambio de día de descanso',m:'Esta semana cambiamos nuestro día de descanso.'},
  vacaciones:{t:'Cerrado por vacaciones',m:'Nos tomamos un respiro.\n¡Os esperamos a la vuelta!'}
};
const IDS=['titulo','cuando','mensaje','vuelta','d1','d2','d3'];
const $=id=>document.getElementById(id);
let rest=null, fmt='retrato', bgImg=null, timer=null;
const logos={};

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function loadFile(file){
  try{return await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){return loadImg(URL.createObjectURL(file));}
}
const iw=i=>i.width||i.naturalWidth, ih=i=>i.height||i.naturalHeight;

/* ---------- fechas ---------- */
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function parts(v){const d=new Date(v+'T12:00:00');return{wd:d.toLocaleDateString('es-ES',{weekday:'long'}),d:d.getDate(),m:d.toLocaleDateString('es-ES',{month:'long'}),mi:d.getMonth()};}
function rango(a,b){
  if(!a)return '';
  const A=parts(a);
  if(!b||b===a)return `${cap(A.wd)} ${A.d} de ${A.m}`;
  const B=parts(b);
  if(A.mi===B.mi)return `Del ${A.wd} ${A.d} al ${B.wd} ${B.d} de ${B.m}`;
  return `Del ${A.wd} ${A.d} de ${A.m} al ${B.wd} ${B.d} de ${B.m}`;
}

/* ---------- estado ---------- */
function getState(){const st={};IDS.forEach(i=>st[i]=$(i).value);st.opac=+$('opac').value/100;return st;}
function save(){try{const s=getState();localStorage.setItem('avisos-marivuelta-castanu',JSON.stringify(s));}catch(e){}}
function restore(){
  try{
    const s=JSON.parse(localStorage.getItem('avisos-marivuelta-castanu')||'null');
    if(s){['titulo','cuando','mensaje','vuelta'].forEach(i=>{if(typeof s[i]==='string')$(i).value=s[i];});if(s.opac)$('opac').value=Math.round(s.opac*100);}
  }catch(e){}
  if(!$('titulo').value&&!$('mensaje').value)applyPreset('cerrado');
}
function applyPreset(p){const P=PRESETS[p];$('titulo').value=P.t;$('mensaje').value=P.m;save();schedule();}

/* ---------- texto ---------- */
function wrap(ctx,text,maxW,ls){
  const mw=t=>ctx.measureText(t).width+ls*Math.max(0,t.length-1);
  const lines=[];
  for(const para of text.split('\n')){
    let cur='';
    for(const w of para.split(/\s+/).filter(Boolean)){
      const t=cur?cur+' '+w:w;
      if(mw(t)<=maxW||!cur)cur=t;else{lines.push(cur);cur=w;}
    }
    if(cur)lines.push(cur);
  }
  return lines;
}
function drawLine(ctx,t,cx,y,ls){
  if(!ls){ctx.textAlign='center';ctx.fillText(t,cx,y);return;}
  let w=0;for(const ch of t)w+=ctx.measureText(ch).width+ls;w-=ls;
  let x=cx-w/2;ctx.textAlign='left';
  for(const ch of t){ctx.fillText(ch,x,y);x+=ctx.measureText(ch).width+ls;}
  ctx.textAlign='center';
}
const lines_of=v=>(v||'').split('\n').map(x=>x.trim()).filter(Boolean);

function pass(ctx,o){
  const {s,k,cw,cx,y0,draw,st,T,logo}=o;
  let y=0;
  const text=(txt,weight,size,color,ls,gap,upper)=>{
    if(!txt||!txt.trim())return;
    txt=txt.trim();if(upper)txt=txt.toUpperCase();
    const px=size*T.ts*k*s,l=ls*k*s;
    ctx.font=`${weight} ${px}px ${T.font}`;
    ctx.fillStyle=color;ctx.textBaseline='top';
    const ls2=wrap(ctx,txt,cw,l),lh=px*1.3;
    for(const ln of ls2){if(draw)drawLine(ctx,ln,cx,y0+y,l);y+=lh;}
    y+=gap*k*s;
  };
  if(logo){
    const L=T.logoS*k*Math.min(1.1,0.6+0.4*s);
    if(draw){ctx.globalCompositeOperation='multiply';ctx.drawImage(logo,cx-L/2,y0+y,L,L);ctx.globalCompositeOperation='source-over';}
    y+=L+14*k*s;
  }
  text(st.titulo,T.tw,92,DARK,T.tls,16,true);
  text(st.cuando,T.hw,48,T.c1,3,0,false);
  y+=26*k*s;
  if(draw){ctx.fillStyle=T.c1;ctx.fillRect(cx-40*k,y0+y,80*k,2*k);}
  y+=34*k*s;
  for(const p of lines_of(st.mensaje))text(p,T.bw,42,DARK,0,16,false);
  if(st.vuelta&&st.vuelta.trim()){y+=14*k*s;text(st.vuelta,T.hw,46,T.c1,2,0,false);}
  return y;
}

async function render(cv,f){
  const T=THEMES[rest];
  const F=FORMATS[f],W=F.w,H=F.h,k=W/1080,st=getState();
  cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  if(bgImg){
    const sc=Math.max(W/iw(bgImg),H/ih(bgImg)),dw=iw(bgImg)*sc,dh=ih(bgImg)*sc;
    ctx.drawImage(bgImg,(W-dw)/2,(H-dh)/2,dw,dh);
  }else{ctx.fillStyle=T.bg;ctx.fillRect(0,0,W,H);}
  const px=F.inset.x*k,pt=F.inset.t*k,pb=F.inset.b*k;
  const pw=W-2*px,ph=H-pt-pb,pad=48*k;
  ctx.globalAlpha=bgImg?st.opac:Math.max(st.opac,0.96);
  ctx.fillStyle='#ffffff';ctx.fillRect(px,pt,pw,ph);ctx.globalAlpha=1;
  const cw=pw-2*pad,cx=W/2;
  const fpx=26*T.ts*k;
  ctx.font=`${T.bw} ${fpx}px ${T.font}`;ctx.fillStyle=DARK;ctx.textBaseline='top';
  const fl=[...wrap(ctx,T.addr,cw,0),...wrap(ctx,T.res,cw,0)];
  const flh=fpx*1.4,fh=fl.length*flh;
  const avail=ph-2*pad-fh-34*k;
  const logo=logos[rest];
  let s=1.3,h;
  for(;;){
    h=pass(ctx,{s,k,cw,cx,y0:0,draw:false,st,T,logo});
    if(h<=avail||s<=0.35)break;
    s-=0.03;
  }
  const y0=pt+pad+Math.max(0,(avail-h)/2);
  pass(ctx,{s,k,cw,cx,y0,draw:true,st,T,logo});
  const fy=pt+ph-pad-fh;
  ctx.fillStyle=T.c1;ctx.fillRect(cx-40*k,fy-18*k,80*k,2*k);
  ctx.font=`${T.bw} ${fpx}px ${T.font}`;ctx.fillStyle=DARK;ctx.textBaseline='top';ctx.textAlign='center';
  fl.forEach((ln,i)=>ctx.fillText(ln,cx,fy+i*flh));
}

async function fontsReady(){
  if(!rest)return;
  const T=THEMES[rest],fam=T.font.split(',')[0];
  try{await Promise.all(T.fw.map(w=>document.fonts.load(`${w} 40px ${fam}`)));}catch(e){}
}
function schedule(){
  if(!rest)return;
  clearTimeout(timer);
  timer=setTimeout(async()=>{await fontsReady();await render($('cv'),fmt);},120);
}

/* ---------- exportar ---------- */
function makePdf(jpg,pxW,pxH){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length;};
  const obj=(n,body)=>{off[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n');};
  const PW=419.53,PH=595.28;
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  off[4]=len;
  push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);
  push(jpg);push('\nendstream\nendobj\n');
  const c=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  obj(5,`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
  const xref=len;
  push('xref\n0 6\n0000000000 65535 f \n');
  for(let i=1;i<=5;i++)push(String(off[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function makeFile(f){
  await fontsReady();
  const cv=document.createElement('canvas');
  await render(cv,f);
  const jpg=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.93));
  const base=THEMES[rest].slug+'-aviso';
  if(f==='a5'){
    const bytes=new Uint8Array(await jpg.arrayBuffer());
    return new File([makePdf(bytes,cv.width,cv.height)],base+'_A5.pdf',{type:'application/pdf'});
  }
  return new File([jpg],base+'_'+f+'.jpg',{type:'image/jpeg'});
}
function saveFile(file){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(file);a.download=file.name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
async function download(f){if(!rest)return;try{saveFile(await makeFile(f));}catch(e){alert('No se pudo generar el archivo.');}}

/* ---------- eventos ---------- */
document.querySelectorAll('#sel button').forEach(b=>b.onclick=async()=>{
  rest=b.dataset.r;
  document.querySelectorAll('#sel button').forEach(x=>x.classList.toggle('on',x===b));
  document.body.dataset.r=rest;
  $('empty').style.display='none';$('work').style.display='block';
  ['dlRetrato','dlStory','dlA5','share'].forEach(i=>$(i).disabled=false);
  const n=THEMES[rest].name;
  $('dlRetrato').textContent='Descargar Retrato (JPG) · '+n;
  $('dlStory').textContent='Descargar Story (JPG) · '+n;
  $('dlA5').textContent='Descargar A5 (PDF) · '+n;
  if(!logos[rest]){try{logos[rest]=await loadImg(THEMES[rest].logo);}catch(e){}}
  schedule();
});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  fmt=b.dataset.f;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  schedule();
});
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>applyPreset(b.dataset.p));
['titulo','cuando','mensaje','vuelta','opac'].forEach(i=>$(i).addEventListener('input',()=>{save();schedule();}));
['d1','d2'].forEach(i=>$(i).addEventListener('change',()=>{
  const t=rango($('d1').value,$('d2').value);
  if(t){$('cuando').value=t;}
  save();schedule();
}));
$('d3').addEventListener('change',()=>{
  if($('d3').value){const p=parts($('d3').value);$('vuelta').value=`Volvemos el ${p.wd} ${p.d} de ${p.m}`;}
  save();schedule();
});
$('bg').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{bgImg=await loadFile(f);}catch(err){alert('No se pudo abrir la imagen.');}
  e.target.value='';schedule();
});
$('bgQuit').onclick=()=>{bgImg=null;schedule();};
$('dlRetrato').onclick=()=>download('retrato');
$('dlStory').onclick=()=>download('story');
$('dlA5').onclick=()=>download('a5');
$('share').onclick=async()=>{
  if(!rest)return;
  try{
    const file=await makeFile(fmt);
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});
    else saveFile(file);
  }catch(e){if(e&&e.name!=='AbortError')alert('No se pudo compartir.');}
};
restore();
</script>
</body>
</html>
